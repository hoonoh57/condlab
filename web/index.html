<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>condlab - 조건검색 · 데이터 동기화</title>
<style>
:root{--bg:#0f1420;--card:#18202f;--line:#27334a;--fg:#e6ecf5;--dim:#8fa0bb;--ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c;--acc:#4aa3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Malgun Gothic",system-ui,sans-serif}header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}h1{font-size:17px;margin:0}.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line)}.tab{padding:10px 18px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent}.tab.on{color:var(--fg);border-color:var(--acc)}main{padding:20px;max-width:1240px}.pane{display:none}.pane.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.k{color:var(--dim);font-size:12px}.v{font-size:20px;font-weight:600}.badge{padding:3px 10px;border-radius:99px;font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}button{background:var(--acc);border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer}.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}.danger{background:var(--bad);color:white}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}label{display:block;color:var(--dim);font-size:12px}input,select{width:100%;background:#0b1220;border:1px solid var(--line);color:var(--fg);padding:7px;border-radius:5px}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}pre{background:#0b1220;padding:12px;max-height:300px;overflow:auto}.mt{margin-top:16px}.mb{margin-bottom:12px}
</style>
</head>
<body>
<header><h1>condlab</h1><span id="header" class="badge warn">확인 중...</span><span id="headerDetail" class="k"></span></header>
<nav class="tabs"><div class="tab on" data-pane="dash">대시보드</div><div class="tab" data-pane="sync">데이터 동기화</div><div class="tab" data-pane="scan">조건검색</div><div class="tab" data-pane="hist">작업이력</div></nav>
<main>
<section id="dash" class="pane on"><div class="grid"><div class="card"><div class="k">일봉 최종일</div><div id="dailyMax" class="v">-</div></div><div class="card"><div class="k">분봉 최종일</div><div id="minMax" class="v">-</div></div><div class="card"><div class="k">분봉 보유일수</div><div id="minDays" class="v">-</div></div><div class="card"><div class="k">분봉 행수</div><div id="minRows" class="v">-</div></div></div><div class="card mt"><h3>동기화 상태</h3><p id="todo">확인 중...</p><button id="runAuto">오늘 데이터 동기화</button><button class="ghost" id="goScan">조건검색으로 이동</button></div></section>
<section id="sync" class="pane"><div class="card mb"><h3>작업 선택</h3><div class="row"><div><label>모드</label><select id="mode"><option value="auto">자동</option><option value="daily">일봉·종목마스터</option><option value="min1">분봉 누락분</option><option value="reconcile">정합성 검사</option><option value="full">전체 재구축</option></select></div><div><label>&nbsp;</label><button id="start">실행</button> <button class="danger" id="cancel">중단</button></div></div></div><div class="card"><h3>진행 상황</h3><p id="progress">대기</p><pre id="log">대기 중...</pre></div></section>
<section id="scan" class="pane"><div class="card mb"><h3>조건검색</h3><div class="row"><div><label>기준일</label><input id="date" type="date"></div><div><label>종료일</label><input id="dateTo" type="date"></div><div><label>이평 기간</label><input id="ma" type="number" value="60"></div><div><label>등락률 최소</label><input id="chgMin" type="number" step=".01" value=".02"></div><div><label>등락률 최대</label><input id="chgMax" type="number" step=".01" value=".12"></div><div><label>거래량 배수</label><input id="vol" type="number" step=".1" value="1.5"></div><div><label>시장</label><select id="market"><option>ALL</option><option>KOSPI</option><option>KOSDAQ</option></select></div></div><button class="mt" id="scan">조건검색 실행</button><span id="scanMeta" class="k"></span></div><div class="card"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<section id="hist" class="pane"><div class="card"><h3>동기화 실행 이력</h3><table><thead><tr><th>시작</th><th>모드</th><th>종료</th><th>성공</th><th>일수</th><th>행수</th></tr></thead><tbody id="history"></tbody></table></div></section>
</main>
<script>
const $=s=>document.querySelector(s), fmt=n=>n==null?'-':Number(n).toLocaleString();
async function get(url){return (await fetch(url)).json()} async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});return {ok:r.ok,data:await r.json()}}
function pane(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.pane===name));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===name));if(name==='hist')runs()}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>pane(x.dataset.pane));$('#goScan').onclick=()=>pane('scan');
async function tick(){try{const s=await get('/api/status'),y=s.sync,c=s.min1_coverage;$('#dailyMax').textContent=s.daily?.d_max||'-';$('#minMax').textContent=c.d_max||'없음';$('#minDays').textContent=fmt(c.days);$('#minRows').textContent=fmt(c.rows);$('#header').textContent=y.running?'동기화 중':'준비 완료';$('#header').className='badge '+(y.running?'warn':'ok');$('#headerDetail').textContent=y.running?y.phase+' · '+y.current:(s.last_sync_at||'');$('#todo').textContent=s.needs_today_sync?'오늘 동기화가 필요합니다.':'오늘 동기화가 완료되었습니다.';$('#progress').textContent=`${y.phase} ${y.done}/${y.total} · ${fmt(y.rows_added)}행`;$('#log').textContent=(y.log||[]).join('\n')}catch(e){$('#header').textContent='서버 응답 없음';$('#header').className='badge warn'}}
async function startSync(mode){const r=await post('/api/sync/start',{mode});if(!r.ok)alert(r.data.msg||'실행 실패');pane('sync');tick()}$('#runAuto').onclick=()=>startSync('auto');$('#start').onclick=()=>startSync($('#mode').value);$('#cancel').onclick=async()=>{const r=await post('/api/sync/cancel');alert(r.data.msg);tick()};
$('#scan').onclick=async()=>{const params={ma_period:+$('#ma').value,chg_min:+$('#chgMin').value,chg_max:+$('#chgMax').value,vol_mult:+$('#vol').value,min_price:1000,min_amt:1000000000,sec_class:'COMMON',market:$('#market').value,over_max:100,bull:1};const body={date:$('#date').value,params};if($('#dateTo').value)body.d_to=$('#dateTo').value;const r=await post('/api/scan',body);if(!r.ok){alert(r.data.detail||'실패');return}$('#scanMeta').textContent=`${fmt(r.data.n_hits)}건`;const hits=r.data.hits||[];if(!hits.length){$('#head').innerHTML='';$('#body').innerHTML='<tr><td>검색 결과 없음</td></tr>';return}const cols=Object.keys(hits[0]);$('#head').innerHTML='<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';$('#body').innerHTML=hits.map(row=>'<tr>'+cols.map(c=>`<td>${row[c]}</td>`).join('')+'</tr>').join('')};
async function runs(){const d=await get('/api/runs');$('#history').innerHTML=(d.runs||[]).map(r=>`<tr><td>${r.started_at||'-'}</td><td>${r.mode}</td><td>${r.finished_at||'진행중'}</td><td>${r.ok==null?'-':r.ok?'성공':'실패'}</td><td>${fmt(r.days_done)}</td><td>${fmt(r.rows_added)}</td></tr>`).join('')}
(async()=>{const s=await get('/api/status');if(s.daily?.d_max)$('#date').value=s.daily.d_max;tick();setInterval(tick,1500)})();
</script>
</body></html>
